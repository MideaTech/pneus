<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MideaTech | Catálogo de Estoque</title>
  <link rel="icon" href="icons/iconeAba.png" type="image/png" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo">MideaTech<span>PNEUS</span></div>
      <div class="header-actions">
        <span id="badge-modo-interno" class="badge-modo-interno hidden">Modo Interno</span>
        <button id="btn-cadeado" class="btn-cadeado" title="Acesso Interno">🔒</button>
      </div>
    </div>
  </header>

  <main>
    <h1 class="section-title">Catálogo de Pneus</h1>
    <p class="section-subtitle">Filtre por marca ou pelas dimensões que seu veículo precisa</p>

    <!-- Área de Filtros -->
    <section class="filter-section">
      <div class="filter-title">Filtrar Produtos</div>
      <div class="filter-grid">
        <div class="filter-group">
          <label for="select-marca">Marca</label>
          <select id="select-marca">
            <option value="">Todas</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="select-largura">Largura (mm)</label>
          <select id="select-largura">
            <option value="">Todas</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="select-perfil">Perfil / Altura (%)</label>
          <select id="select-perfil">
            <option value="">Todos</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="select-aro">Aro / Raio (pol.)</label>
          <select id="select-aro">
            <option value="">Todos</option>
          </select>
        </div>

        <button id="btn-reset" class="btn-reset">Limpar Filtros</button>
      </div>
    </section>

    <!-- Grid de Pneus -->
    <div id="grid-pneus" class="grid-container">
      <div class="status-msg">Carregando estoque...</div>
    </div>
  </main>

  <!-- Botão Voltar ao Topo -->
  <button id="btn-topo" class="btn-topo hidden" title="Voltar ao topo">↑</button>

  <!-- Modal de Senha -->
  <div id="modal-senha" class="modal-overlay hidden">
    <div class="modal-card">
      <h2 class="modal-title">Acesso Restrito</h2>
      <p class="modal-desc">Digite a senha para acessar o Modo Interno e visualizar os custos de estoque.</p>
      <form id="form-senha">
        <div class="input-password-wrapper">
          <input type="password" id="input-senha" placeholder="Digite a senha..." required autocomplete="off" />
          <button type="button" id="btn-toggle-senha" class="btn-toggle-senha" title="Mostrar senha" aria-label="Mostrar senha">
            <!-- SVG Olho Aberto -->
            <svg id="icon-eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <!-- SVG Olho Fechado (inicia oculto) -->
            <svg id="icon-eye-closed" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
              <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
              <line x1="2" x2="22" y1="2" y2="22"></line>
            </svg>
          </button>
        </div>
        <p id="msg-erro-senha" class="error-msg hidden">Senha incorreta. Tente novamente.</p>
        <div class="modal-buttons">
          <button type="button" id="btn-fechar-modal" class="btn-secundario">Cancelar</button>
          <button type="submit" class="btn-primario">Entrar</button>
        </div>
      </form>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
